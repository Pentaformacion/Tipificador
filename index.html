<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente de Tipificación BBVA</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Asistente de Tipificación</h1>
    <p>Soporte Técnico Sucursales BBVA</p>
</header>

<main>

    <div class="card" id="questionCard">

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <h2 id="questionTitle">
            ¿Qué problema reporta el usuario?
        </h2>

        <div id="optionsContainer"></div>

    </div>

    <div class="card hidden" id="resultCard">

        <h2>Tipificación Correcta</h2>

        <div id="resultContent"></div>

        <div class="actions">
            <button onclick="copyResult()">Copiar Tipificación</button>
            <button onclick="restart()">Nueva Consulta</button>
        </div>

    </div>

</main>

<script src="app.js"></script>
</body>
</html>
